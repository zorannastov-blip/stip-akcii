# Како се претставува скриптата пред сајтовите на маркетите. Само ASCII.
# Добро е тука да стои адресата на твоето репо, за да знаат кој ги чита.
agent = "stip-akcii/0.1 (licno dnevno citanje na javni cenovnici)"
# Пауза меѓу две барања кон ист сајт, во секунди. Не ја намалувај.
pauza_sekundi = 1.5

# --------------------------------------------------------------------------
# Кошничка: основни производи за кои секој ден се бара најевтиниот маркет.
# Влегува најевтината стока од тој вид, без оглед на брендот.
#
#   ime        како се вика ставката во извештајот
#   bara       зборови што називот или описот мора да ги има; „а|б" значи
#              едно од двете; се гледа почетокот на зборот („леб" фаќа и „лебови"),
#              а со празно место на крајот („сол ") се бара цел збор
#   bez        ако називот или описот содржи нешто од ова, производот се прескокнува
#   bez_naziv  исто, но се гледа само називот
#   pakuvanje  кои пакувања се споредуваат: „1 л", „400-500 г", „8-24 парчиња";
#              ставка во килограми гледа само стока на тежина, ставка во литри
#              само стока на волумен
#   kg_i_l     true ако стоката се продава и на тежина и на волумен (јогурт)
#   nedelno    колку троши четиричлено семејство неделно (проценка; од неа се
#              пресметува колку чини целата кошничка во секој маркет)
#   na_kilo    true за свежа стока што се продава на килограм без количина во називот
#
# Проба по промена:  python -m stipakcii.kosnicka --kandidati 5
# --------------------------------------------------------------------------

