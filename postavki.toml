# Поставки за дневното читање. Сè тука може да се смени без допирање на кодот.

# Градот чии продавници се читаат.
grad = "Штип"

# Синџири што се читаат. Достапни: kam, ramstore, stokomak, zito, kipper
sinjiri = ["kam", "ramstore", "stokomak", "zito", "kipper"]

# Производи што ги следиш. Секој запис е еден или повеќе збора што СИТЕ мора
# да ги има називот или описот; мали и големи букви не се важни.
# Тие добиваат свој филтер „Мои производи" на страницата и свој дел во
# IZVESTAJ.md. Пример:
#   sledi = ["кафе", "масло сончоглед", "детергент ариел", "orangina"]
sledi = [
  # кафе
  "лаваца оро", "lavazza oro", "кафе",
  # млечно и јајца
  "млеко", "јогурт", "сирење", "кашкавал", "павлака", "путер", "јајца",
  # основно
  "леб", "брашно", "шеќер", "масло", "ориз", "тестенини",
  # месо
  "пилешк", "месо", "виршл",
  # за кучињата
  "куче", "кучиња", "миленици",
]

