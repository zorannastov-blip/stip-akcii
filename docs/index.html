function izberi() {
  const zborovi = sostojba.baraj.toLowerCase().split(/\s+/).filter(Boolean);
  const lista = D.akcii.filter((a) => {
    if (sostojba.sinjiri.size && !sostojba.sinjiri.has(a.sk)) return false;
    if (sostojba.filter === "novi" && !a.nov) return false;
    if (sostojba.filter === "istek" && !a.istek) return false;
    if (sostojba.filter === "moi" && !a.sl) return false;
    if (sostojba.filter === "idni" ? !a.idna : a.idna) return false;
    if (!zborovi.length) return true;
    const tekst = (a.n + " " + a.o + " " + a.s).toLowerCase();
    return zborovi.every((z) => tekst.includes(z));
  });
  const red = {
    pct: (a, b) => (b.pct || 0) - (a.pct || 0) || a.n.localeCompare(b.n, "mk"),
    cena: (a, b) => (a.c ?? 1e9) - (b.c ?? 1e9) || a.n.localeCompare(b.n, "mk"),
    istek: (a, b) => (a.do || "9999").localeCompare(b.do || "9999") || (b.pct || 0) - (a.pct || 0),
    naziv: (a, b) => a.n.localeCompare(b.n, "mk"),
  }[sostojba.podredi];
  return lista.sort(red);
}

function kartaAkcija(a) {
  const oznaki = [];
  if (a.nov) oznaki.push('<span class="oznaka novo">ново денес</span>');
  if (a.idna) oznaki.push(`<span class="oznaka tivka">почнува ${datum(a.od)}</span>`);
  if (a.kart) oznaki.push('<span class="oznaka kart">само со картичка</span>');
  if (a.viden) oznaki.push(`<span class="oznaka tivka">од читањето на ${datum(a.viden)}</span>`);
  if (a.pred) oznaki.push(`<span class="oznaka predupr">${esc(a.pred)}</span>`);
  const edinecna = a.e ? `<span class="edinecna">${cena(a.e)}${a.ed ? " / " + esc(a.ed) : ""}</span>` : "";
  const do_ = a.do ? ` · до ${datum(a.do)}` : "";
  return `<article class="karta">
    <div class="naziv">${esc(a.n)}</div>
    ${a.o ? `<div class="opis">${esc(a.o)}</div>` : ""}
    <div class="ceni">
      <span class="cena">${cena(a.c)}</span>
      ${a.r != null ? `<span class="redovna">${cena(a.r)}</span>` : ""}
      ${a.pct ? `<span class="pct">−${String(a.pct).replace(".", ",")}%</span>` : ""}
      ${edinecna}
    </div>
    <div class="meta"><b>${esc(a.s)}</b> · ${esc(kade(a))}${do_}</div>
    ${oznaki.length ? `<div class="oznaki">${oznaki.join("")}</div>` : ""}
  </article>`;
}

function crtajAkcii() {
  const lista = izberi();
  el("broj").textContent = lista.length + " ставки";
  if (!lista.length) {
    const prazna = sostojba.filter === "moi" && !sostojba.baraj
      ? "Денес нема акција за производите што ги следиш."
      : "Нема акции за овој избор.";
    el("sodrzina").innerHTML = `<p class="prazno">${prazna}</p>`;
    return;
  }
  const del = lista.slice(0, sostojba.prikazani).map(kartaAkcija).join("");
  const ostanati = lista.length - sostojba.prikazani;
  el("sodrzina").innerHTML = del + (ostanati > 0
    ? `<button class="uste" id="uste">Прикажи уште ${Math.min(ostanati, STRANA)} од ${ostanati}</button>` : "");
  const kopce = el("uste");
  if (kopce) kopce.onclick = () => { sostojba.prikazani += STRANA; crtajAkcii(); };
}

function crtajPromeni() {
  if (!D.promeni.length) {
    el("sodrzina").innerHTML = '<p class="prazno">Денес нема променета редовна цена во однос на претходното читање.</p>';
    return;
  }
  const lista = [...D.promeni].sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct));
  el("sodrzina").innerHTML = lista.slice(0, 400).map((x) => `<article class="karta">
    <div class="naziv">${esc(x.n)}</div>
    <div class="ceni">
      <span class="redovna">${cena(x.stara)}</span>
      <span class="cena">${cena(x.nova)}</span>
      <span class="${x.pct > 0 ? "gore" : "dolu"}">${x.pct > 0 ? "+" : "−"}${String(Math.abs(x.pct)).replace(".", ",")}%</span>
    </div>
    <div class="meta"><b>${esc(x.s)}</b> · ${esc([...new Set(x.p)].join(", "))}</div>
  </article>`).join("");
}

const STATUSI = {
  ok: "прочитан", prazen: "објавен празен ценовник",
  padna: "не се прочита", ja_nema: "ја нема кај изворот",
  nema: "нема продавница во градот",
};

function crtajIzvori() {
  if (!D.prodavnici.length) {
    el("sodrzina").innerHTML = '<p class="prazno">Уште нема ниту едно читање.</p>';
    return;
  }
  el("sodrzina").innerHTML = D.prodavnici.map((z) => {
    const dobro = z.status === "ok";
    const brojki = z.redovi ? `${esc(z.redovi)} производи · ${esc(z.akcii)} акции` : "";
    const koga = z.posledno_uspesno ? `прочитан ${datum(z.posledno_uspesno)}` : "уште не е прочитан";
    return `<article class="karta">
      <div class="naziv">${esc(z.sinjir_ime)} · ${esc(z.prodavnica)}</div>
      ${z.adresa ? `<div class="opis">${esc(z.adresa)}</div>` : ""}
      <div class="meta"><span class="${dobro ? "dolu" : "gore"}">${esc(STATUSI[z.status] || z.status)}</span>
        · ${[brojki, koga].filter(Boolean).join(" · ")}</div>
      ${!dobro && z.poraka ? `<div class="opis">${esc(z.poraka)}</div>` : ""}
    </article>`;
  }).join("");
}

function crtaj() {
  el("alatki").hidden = sostojba.pogled !== "akcii";
  ({ akcii: crtajAkcii, promeni: crtajPromeni, izvori: crtajIzvori })[sostojba.pogled]();
}

function cip(roditel, tekst, pritisnat, naKlik) {
  const k = document.createElement("button");
  k.className = "cip";
  k.textContent = tekst;
  k.setAttribute("aria-pressed", pritisnat);
  k.onclick = () => naKlik(k);
  roditel.appendChild(k);
  return k;
}

function postavi() {
  if (!D) {
    el("sodrzina").innerHTML = '<p class="prazno">Страницата уште нема податоци. Пушти го читањето.</p>';
    el("alatki").hidden = true;
    return;
  }
  const vazecki = D.akcii.filter((a) => !a.idna);
  const broi = (uslov) => vazecki.filter(uslov).length;
  el("naslov").textContent = "Акции во " + D.grad;
  el("zbir").textContent = `${datum(D.datum)}${D.datum.slice(0, 4)} · ${vazecki.length} акции · `
    + `${broi((a) => a.nov)} нови · ${broi((a) => a.istek)} истекуваат`;
  el("izraboteno").textContent = "Изработено " + D.izraboteno + ".";
  el("legenda").textContent = "Предупредувањето за покачена цена гледа " + D.denovi + " дена наназад.";

  const denes = new Date();
  const lokalno = denes.getFullYear() + "-" + String(denes.getMonth() + 1).padStart(2, "0")
    + "-" + String(denes.getDate()).padStart(2, "0");
  if (D.datum !== lokalno) {
    el("zastareno").hidden = false;
    el("zastareno").textContent = "Податоците се од " + datum(D.datum)
      + " Денешното читање уште не поминало или не успеало.";
  }
  const padnati = D.prodavnici.filter((z) => z.status !== "ok").length;
  if (padnati) {
    const p = document.createElement("p");
    p.className = "znamence";
    p.textContent = padnati + " од " + D.prodavnici.length
      + " продавници немаат денешен ценовник. Види „Извори“.";
    el("zastareno").after(p);
  }

  const filtri = [
    ["site", "Сите"], ["novi", "Нови денес"], ["istek", "Истекуваат"],
    ...(D.sledi.length ? [["moi", "Мои производи"]] : []),
    ...(D.akcii.some((a) => a.idna) ? [["idni", "Најавени"]] : []),
  ];
  const kopcinja = filtri.map(([kod, ime]) => cip(el("filtri"), ime, kod === "site", () => {
    sostojba.filter = kod; sostojba.prikazani = STRANA;
    kopcinja.forEach((k, i) => k.setAttribute("aria-pressed", filtri[i][0] === kod));
    crtaj();
  }));

  const iminja = new Map(D.akcii.map((a) => [a.sk, a.s]));
  [...iminja].sort((a, b) => a[1].localeCompare(b[1], "mk")).forEach(([kod, ime]) => {
    cip(el("sinjiri"), ime, false, (k) => {
      sostojba.sinjiri.has(kod) ? sostojba.sinjiri.delete(kod) : sostojba.sinjiri.add(kod);
      k.setAttribute("aria-pressed", sostojba.sinjiri.has(kod));
      sostojba.prikazani = STRANA; crtaj();
    });
  });

  let cekanje;
  el("baraj").oninput = (e) => {
    clearTimeout(cekanje);
    cekanje = setTimeout(() => {
      sostojba.baraj = e.target.value; sostojba.prikazani = STRANA; crtaj();
    }, 120);
  };
  el("podredi").onchange = (e) => { sostojba.podredi = e.target.value; crtaj(); };
  document.querySelectorAll("[data-pogled]").forEach((k) => {
    k.onclick = () => {
      sostojba.pogled = k.dataset.pogled;
      document.querySelectorAll("[data-pogled]").forEach((d) =>
        d.setAttribute("aria-selected", d === k));
      crtaj();
    };
  });
  crtaj();
}

postavi();
</script>
</body>
</html>
